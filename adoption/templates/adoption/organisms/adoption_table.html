<div class="table-responsive">
    <table class="table table-hover table-striped align-middle mb-0">
        <thead class="table-primary">
            <tr>
                <th scope="col" class="ps-4">
                    <i class="bi bi-card-heading me-2"></i>Name
                </th>
                <th scope="col">
                    <i class="bi bi-tags me-2"></i>Breed
                </th>
                <th scope="col" class="text-center">
                    <i class="bi bi-bug me-2"></i>Dog
                </th>
                <th scope="col" class="text-center">
                    <i class="bi bi-bug-fill me-2"></i>Cat
                </th>
                <th scope="col" class="text-center">
                    <i class="bi bi-calendar3 me-2"></i>Age
                </th>
                <th scope="col" class="text-center">
                    <i class="bi bi-heart me-2"></i>Status
                </th>
                <th scope="col" class="text-center pe-4">
                    <i class="bi bi-gear me-2"></i>Actions
                </th>
            </tr>
        </thead>
        <tbody>
            {% for pet in pets %}
                {% include 'adoption/molecules/adoption_row.html' with pet=pet %}
            {% empty %}
                <tr>
                    <td colspan="7" class="text-center py-5">
                        <div class="empty-state">
                            <i class="bi bi-emoji-frown display-4 text-muted"></i>
                            <h4 class="mt-3 text-muted">No pets available</h4>
                            <p class="text-muted">Add your first pet to get started!</p>
                            {% if user.is_authenticated and user.profile.role == 'admin' %}
                            <a href="{% url 'adoption:pet_create' %}" class="btn btn-primary mt-3">
                                <i class="bi bi-plus-circle me-2"></i>Add First Pet
                            </a>
                            {% endif %}
                        </div>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
